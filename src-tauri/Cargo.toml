[package]
name = "leafstarter"
version = "0.1.0"
description = "LeafStarter — Minecraft Java 版启动器"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "leafstarter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "http2", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
toml = "1"
# 局域网直传：小 HTTP 服务、加密、配对二维码
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"
# 常驻服务器（M10）：SSH、打包世界
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tar = "0.4"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 和 Tauri 用的同一个版本，只多开几个功能：快捷方式、跳转列表、读 Shift 键
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
