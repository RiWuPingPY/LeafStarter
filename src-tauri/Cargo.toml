[package]
name = "mc-supply"
version = "0.1.0"
description = "方块补给 — Minecraft 版本与加载器下载器"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "mc_supply_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
futures-util = "0.3"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
