# LeafStarter 源站接口（http 层，放 /etc/nginx/conf.d/leafstarter.conf）：限速区、给防刷守护看的日志格式、上游
# 每个 IP：每秒 10 个、突发 40 个（中文名搜一次会同时发 6～7 个），同时处理中的请求 30 个（学校机房共用一个出口 IP 也够）
limit_req_zone  $binary_remote_addr zone=ls_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ls_conn:10m;
log_format ls_guard '$msec $remote_addr $status $body_bytes_sent $request_time';
upstream ls_api {
    server 127.0.0.1:8790;
    keepalive 16;
}
