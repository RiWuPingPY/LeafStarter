# LeafStarter 源站接口（放 /etc/nginx/snippets/leafstarter.conf，include 进 api.pingyi.me 的 8443 server 块）
# api.pingyi.me:8443/ls/… → ls-api（127.0.0.1:8790）
location /ls/ {
    # 防护模式（ls-guard 打开时有这个文件）：直接断开，启动器自动改走 Cloudflare Worker
    if (-f /run/ls-guard/shield) { return 444; }
    # 和本站别的接口一样：没有来源头的裸请求（扫描器）直接断开；启动器会带 Origin
    if ($api_deny) { return 444; }
    limit_req zone=ls_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn ls_conn 30;
    limit_conn_status 429;
    client_max_body_size 256k;
    # 只记 ls-guard 要用的几个字段，单独一个文件
    access_log /var/log/nginx/ls.access.log ls_guard;
    gzip on;
    gzip_types application/json;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_comp_level 5;
    proxy_pass http://ls_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}
