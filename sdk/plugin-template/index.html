<!-- 脚本插件的入口：一个 HTML 文件（样式和脚本都写在里面）。
     它跑在隔离的 iframe 里，不能直接联网，也碰不到启动器的后端；要做事就调 leafstarter.call()。 -->
<style>
  .n { font-size: 28px; font-weight: 700; }
  .sub { opacity: .7; font-size: 12px; }
</style>
<div class="n" id="count">…</div>
<div class="sub" id="sub">个实例</div>
<script>
  (async () => {
    const list = await leafstarter.call('instances.list');
    document.getElementById('count').textContent = list.length;
    const cur = await leafstarter.call('instance.current');
    document.getElementById('sub').textContent = `个实例 · 现在选的是「${cur?.name ?? '没有'}」`;
    // 记一下打开过几次（storage 权限）
    const n = ((await leafstarter.call('storage.get', { key: 'opened' })) || 0) + 1;
    await leafstarter.call('storage.set', { key: 'opened', value: n });
  })();
  // 游戏崩溃时提醒（events 权限）
  leafstarter.on('launch', (e) => {
    if (e.phase === 'crashed') leafstarter.call('ui.toast', { text: '游戏崩了，看看概览里的原因' });
  });
</script>
